<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — MALIYA-MD</title>
<link rel="icon" type="image/png" href="https://maliya-md.vercel.app/logo.png">
<script>(function(){var t=localStorage.getItem('maliya_theme')||'white';document.documentElement.setAttribute('data-theme',t)})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root,[data-theme="white"]{
  --t-txt:#0f172a;--t-txt-2:#475569;--t-txt-3:#64748b;--t-txt-4:#94a3b8;
  --t-card:rgba(255,255,255,.94);--t-card-solid:#fff;--t-border:rgba(226,232,240,.95);
  --t-input:#f8fafc;--t-input-border:#e2e8f0;--t-accent:#6366f1;--t-accent-2:#8b5cf6;
  --t-orb-1:rgba(165,180,252,.4);--t-orb-2:rgba(196,181,233,.4);--t-orb-3:rgba(186,230,253,.6);
  --t-bg:radial-gradient(1200px 800px at 15% 5%,#e0e7ff 0%,transparent 60%),radial-gradient(1000px 700px at 85% 20%,#ede9fe 0%,transparent 55%),radial-gradient(900px 600px at 50% 100%,#e0f2fe 0%,transparent 60%),linear-gradient(180deg,#f8fafc 0%,#eef2ff 45%,#f8fafc 100%)
}
[data-theme="black"]{
  --t-txt:#e8eaf6;--t-txt-2:#cbd5e1;--t-txt-3:#a5b4fc;--t-txt-4:#64748b;
  --t-card:rgba(20,22,45,.88);--t-card-solid:#14162d;--t-border:rgba(99,102,241,.28);
  --t-input:rgba(30,35,65,.65);--t-input-border:rgba(99,102,241,.32);--t-accent:#818cf8;--t-accent-2:#a78bfa;
  --t-orb-1:rgba(99,102,241,.3);--t-orb-2:rgba(139,92,246,.3);--t-orb-3:rgba(56,189,248,.22);
  --t-bg:radial-gradient(1200px 800px at 15% 5%,rgba(99,102,241,.18) 0%,transparent 60%),radial-gradient(1000px 700px at 85% 20%,rgba(139,92,246,.18) 0%,transparent 55%),radial-gradient(900px 600px at 50% 100%,rgba(56,189,248,.12) 0%,transparent 60%),linear-gradient(180deg,#0a0a18 0%,#0f0f24 45%,#0a0a18 100%)
}
@property --h-ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes hBorderSpin{to{--h-ang:360deg}}
[data-theme="horror"]{
  --t-txt:#ffe3e3;--t-txt-2:#ffb4b4;--t-txt-3:#d96363;--t-txt-4:#8a2b2b;
  --t-card:rgba(14,0,0,.68);--t-card-solid:rgba(26,0,0,.9);--t-border:rgba(255,38,38,.32);
  --t-input:rgba(38,0,0,.58);--t-input-border:rgba(255,38,38,.28);
  --t-accent:#ff2626;--t-accent-2:#9c0000;
  --t-orb-1:rgba(255,0,0,.30);--t-orb-2:rgba(150,0,0,.34);--t-orb-3:rgba(255,40,40,.18);
  --t-bg:#000
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  color:var(--t-txt);
  background:var(--t-bg);
  background-attachment:fixed;
  min-height:100vh;
  padding-bottom:40px;
  transition:background .8s,color .6s
}
[data-theme="horror"] body{background:radial-gradient(1100px 700px at 50% -10%, rgba(140,0,0,.45) 0%, transparent 62%),#000}
a{text-decoration:none;color:inherit}
button{font-family:inherit}

/* BACKGROUND ORBS & HORROR CANVAS */
.bg-decor{position:fixed;inset:0;z-index:-10;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:orbFloat 8s ease-in-out infinite alternate}
.orb1{width:500px;height:500px;background:var(--t-orb-1);top:-150px;left:-100px}
.orb2{width:400px;height:400px;background:var(--t-orb-2);bottom:-100px;right:-80px;animation-delay:3s}
.orb3{width:300px;height:300px;background:var(--t-orb-3);top:40%;left:60%;animation-delay:5s}
@keyframes orbFloat{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,30px) scale(1.1)}}
#horrorCanvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1s ease;pointer-events:none}
[data-theme="horror"] #horrorCanvas{opacity:1}
#horrorCanvasFg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100;opacity:0;transition:opacity 1s ease}
[data-theme="horror"] #horrorCanvasFg{opacity:1}

/* TOP NAVIGATION */
.top-nav{
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  max-width:1100px;margin:0 auto
}
.brand-pill{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--t-card);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--t-border);
  border-radius:14px;padding:6px 14px 6px 8px;
  box-shadow:0 4px 16px -4px rgba(15,23,42,.12);
  transition:transform .2s,border-color .2s
}
.brand-pill:hover{border-color:var(--t-accent);transform:translateY(-1px)}
.brand-badge{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--t-accent),var(--t-accent-2));
  color:#fff;font-weight:800;font-size:13px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px -2px rgba(99,102,241,.45)
}
[data-theme="horror"] .brand-badge{background:linear-gradient(135deg,#ff1a1a,#4a0000);box-shadow:0 0 20px rgba(255,0,0,.65)}
.brand-text{font-size:14px;font-weight:800;letter-spacing:-0.02em;color:var(--t-txt)}
.brand-text span{color:var(--t-accent)}

.nav-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.theme-switch{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--t-card);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--t-border);
  border-radius:12px;padding:4px
}
.t-theme-btn{
  width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--t-txt-3);transition:all .25s;cursor:pointer;border:none;background:transparent
}
.t-theme-btn:hover{background:rgba(99,102,241,.15);color:var(--t-accent)}
.t-theme-btn.active{background:linear-gradient(135deg,var(--t-accent),var(--t-accent-2));color:#fff;box-shadow:0 4px 12px -4px rgba(99,102,241,.5)}
[data-theme="horror"] .t-theme-btn.active{background:linear-gradient(135deg,#ff1a1a,#5e0000);box-shadow:0 0 14px -2px rgba(255,0,0,.8)}

.nav-link-btn{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:700;color:var(--t-txt-2);
  background:var(--t-card);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--t-border);
  border-radius:12px;padding:8px 13px;
  box-shadow:0 4px 12px -4px rgba(15,23,42,.08);
  transition:all .2s
}
.nav-link-btn:hover{border-color:var(--t-accent);color:var(--t-accent);transform:translateY(-1px)}

/* MAIN CONTENT */
.wrap{max-width:700px;margin:16px auto 0;padding:0 16px}
.card{
  position:relative;
  background:var(--t-card);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  border:1px solid var(--t-border);
  border-radius:26px;padding:26px;margin-bottom:18px;
  box-shadow:0 30px 60px -30px rgba(15,23,42,.28);
  transition:background .6s,border-color .6s
}
[data-theme="horror"] .card{background:rgba(12,0,0,.68);backdrop-filter:none;border-color:rgba(255,38,38,.28);box-shadow:0 0 50px -14px rgba(255,0,0,.5)}
[data-theme="horror"] .card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;
  background:conic-gradient(from var(--h-ang),transparent 0deg,transparent 195deg,rgba(255,60,60,.95) 250deg,rgba(255,225,225,1) 263deg,rgba(255,60,60,.95) 276deg,transparent 320deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  animation:hBorderSpin 3.2s linear infinite
}

.profile-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.avatar{width:70px;height:70px;border-radius:50%;border:3px solid var(--t-accent);object-fit:cover;box-shadow:0 8px 20px -6px rgba(99,102,241,.45)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
@media(max-width:520px){.stats{grid-template-columns:1fr}}
.stat-box{background:var(--t-input);border:1.5px solid var(--t-input-border);border-radius:16px;padding:15px;text-align:center}
.stat-box strong{display:block;font-size:22px;font-weight:800;color:var(--t-accent)}
.stat-box span{font-size:11px;font-weight:700;color:var(--t-txt-3);text-transform:uppercase;letter-spacing:.04em}

.order-row{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:13px 15px;border-radius:15px;
  background:var(--t-input);border:1.5px solid var(--t-input-border);
  margin-top:10px;font-size:13px
}
</style>
</head>
<body>

<div class="bg-decor">
  <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
  <canvas id="horrorCanvas"></canvas>
</div>
<canvas id="horrorCanvasFg"></canvas>

<header class="top-nav">
  <a href="index.html" class="brand-pill">
    <span class="brand-badge">M</span>
    <span class="brand-text">MALIYA<span>-MD</span></span>
  </a>

  <div class="nav-actions">
    <div class="theme-switch">
      <button type="button" data-theme-btn="white" class="t-theme-btn" title="White theme">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
      </button>
      <button type="button" data-theme-btn="black" class="t-theme-btn" title="Black theme">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button type="button" data-theme-btn="horror" class="t-theme-btn" title="Horror mode">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a8 8 0 0 0-8 8v3.6a3 3 0 0 0 1 2.2V19a2 2 0 0 0 2 2h1.5v-2h2v2h3v-2h2v2H18a2 2 0 0 0 2-2v-3.2a3 3 0 0 0 1-2.2V10a8 8 0 0 0-8-8z"/><circle cx="9" cy="11.5" r="1.4"/><circle cx="15" cy="11.5" r="1.4"/></svg>
      </button>
    </div>

    <a href="react.html?tab=poll" class="nav-link-btn">← Poll Booster</a>
    <a href="index.html" class="nav-link-btn">Home</a>
  </div>
</header>

<div class="wrap">
  <div class="card" id="profileCard">
    <div style="text-align:center;padding:24px;font-weight:700;color:var(--t-txt-3)">Loading Profile...</div>
  </div>

  <div class="card">
    <h3 style="font-size:17px;font-weight:800;margin-bottom:6px">📜 Recent Poll Boost Orders</h3>
    <div id="ordersList" style="font-size:13px;color:var(--t-txt-3)">Loading history...</div>
  </div>
</div>

<script>
const API_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
  ? ""
  : "https://railway-backend-production-0b48.up.railway.app";

function getAuthHeaders(extra = {}) {
  const m = document.cookie.match(/(?:^|;\s*)maliya_poll_jwt=([^;]+)/);
  const tok = localStorage.getItem("maliya_poll_jwt") || (m ? decodeURIComponent(m[1]) : "");
  return tok ? { ...extra, Authorization: `Bearer ${tok}` } : extra;
}

/* THEME SWITCHER */
(function(){
  function upd(t){document.querySelectorAll('[data-theme-btn]').forEach(b=>b.classList.toggle('active',b.dataset.themeBtn===t))}
  upd(document.documentElement.getAttribute('data-theme')||'white');
  document.querySelectorAll('[data-theme-btn]').forEach(b=>{
    b.addEventListener('click',()=>{
      const t=b.dataset.themeBtn;
      document.documentElement.setAttribute('data-theme',t);
      localStorage.setItem('maliya_theme',t);
      upd(t);
    });
  });
})();

/* LOAD USER PROFILE */
async function loadProfile() {
  try {
    const res = await fetch(`${API_BASE}/api/poll/me`, {
      credentials: "include",
      headers: getAuthHeaders()
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      window.location.href = "react.html?tab=poll";
      return;
    }

    const u = data.user;
    document.getElementById("profileCard").innerHTML = `
      <div class="profile-head">
        <img class="avatar" src="${u.avatar || 'https://maliya-md.vercel.app/logo.png'}" onerror="this.src='https://maliya-md.vercel.app/logo.png'" alt="Avatar">
        <div>
          <h2 style="font-size:21px;font-weight:800">${u.name}</h2>
          <p style="font-size:13px;color:var(--t-txt-3);font-weight:600">${u.email}</p>
          <p style="font-size:11px;color:var(--t-txt-4);margin-top:3px;font-weight:700">Member since ${new Date(u.createdAt).toLocaleDateString()}</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat-box"><strong>${u.coins} 🪙</strong><span>Available Coins</span></div>
        <div class="stat-box"><strong>${Math.floor(u.coins / 25)}</strong><span>Votes Available</span></div>
        <div class="stat-box"><strong>${u.totalVotesOrdered}</strong><span>Total Votes Cast</span></div>
      </div>
    `;

    const ordersEl = document.getElementById("ordersList");
    if (!data.orders || !data.orders.length) {
      ordersEl.textContent = "No poll boost orders yet.";
      return;
    }

    ordersEl.innerHTML = data.orders.map(o => `
      <div class="order-row">
        <div>
          <div style="font-weight:800;color:var(--t-txt)">${o.channelName} — ${o.optionName}</div>
          <div style="font-size:11px;color:var(--t-txt-3);margin-top:2px">${new Date(o.createdAt).toLocaleString()}</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:800;color:#10b981">+${o.votesCount} Votes</div>
          <div style="font-size:11px;color:#f59e0b;font-weight:700">-${o.coinsSpent} Coins</div>
        </div>
      </div>
    `).join("");
  } catch {
    window.location.href = "react.html?tab=poll";
  }
}

/* HORROR ENGINE */
(function(){
  const canvasBg=document.getElementById('horrorCanvas'),canvasFg=document.getElementById('horrorCanvasFg');
  if(!canvasBg||!canvasFg)return;
  const bgCtx=canvasBg.getContext('2d'),fgCtx=canvasFg.getContext('2d');
  let W=0,H=0,DPR=1,running=false,rafId=null,lastRender=0,bolts=[],flash=0,nextBolt=0,embers=[],fgT=0,emberSprites=null;
  function buildSprite(core,mid,edge){const s=48,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d'),grad=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);grad.addColorStop(0,`rgba(${core[0]},${core[1]},${core[2]},1)`);grad.addColorStop(.12,`rgba(${mid[0]},${mid[1]},${mid[2]},1)`);grad.addColorStop(.4,`rgba(${edge[0]},${edge[1]},${edge[2]},.55)`);grad.addColorStop(1,`rgba(${edge[0]},${edge[1]},${edge[2]},0)`);g.fillStyle=grad;g.fillRect(0,0,s,s);return c}
  function resize(){DPR=Math.min(window.devicePixelRatio||1,1.25);W=window.innerWidth;H=window.innerHeight;[canvasBg,canvasFg].forEach(c=>{c.width=Math.floor(W*DPR);c.height=Math.floor(H*DPR)});bgCtx.setTransform(DPR,0,0,DPR,0,0);fgCtx.setTransform(DPR,0,0,DPR,0,0);embers=[];const n=Math.max(30,Math.min(55,Math.round(W*H/42000)));for(let i=0;i<n;i++)embers.push({baseX:Math.random()*W,y:Math.random()*H,vy:2+Math.random()*5,swayAmp:15+Math.random()*40,swaySpeed:.6+Math.random()*1.4,swayPhase:Math.random()*6.28,size:.6+Math.random()*2.2,alpha:.35+Math.random()*.5,sprite:Math.random()<.55?0:1})}
  function midpoint(x1,y1,x2,y2,disp,iter){let pts=[{x:x1,y:y1},{x:x2,y:y2}];for(let k=0;k<iter;k++){const np=[pts[0]];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];np.push({x:(a.x+b.x)/2+(Math.random()-.5)*disp,y:(a.y+b.y)/2+(Math.random()-.5)*disp*.35});np.push(b)}pts=np;disp*=.55}return pts}
  function createBolt(){const sx=Math.random()*W,ex=sx+(Math.random()-.5)*W*.4,ey=H*(.45+Math.random()*.55);bolts.push({pts:midpoint(sx,-30,ex,ey,W*.22,5),life:1,decay:.06});flash=Math.min(1,flash+.5)}
  function frame(ts){if(!running)return;rafId=requestAnimationFrame(frame);if(ts-lastRender<25)return;lastRender=ts;fgT+=.04;bgCtx.clearRect(0,0,W,H);for(let i=bolts.length-1;i>=0;i--){const b=bolts[i],a=Math.max(b.life,0);bgCtx.globalCompositeOperation='lighter';bgCtx.strokeStyle=`rgba(255,30,30,${(.2*a).toFixed(3)})`;bgCtx.lineWidth=7;bgCtx.beginPath();bgCtx.moveTo(b.pts[0].x,b.pts[0].y);for(let j=1;j<b.pts.length;j++)bgCtx.lineTo(b.pts[j].x,b.pts[j].y);bgCtx.stroke();bgCtx.strokeStyle=`rgba(255,200,200,${(.9*a).toFixed(3)})`;bgCtx.lineWidth=1.5;bgCtx.stroke();bgCtx.globalCompositeOperation='source-over';b.life-=b.decay;if(b.life<=0)bolts.splice(i,1)}if(flash>.003){bgCtx.fillStyle=`rgba(255,0,0,${(flash*.08).toFixed(4)})`;bgCtx.fillRect(0,0,W,H);flash*=.87}if(ts>nextBolt){createBolt();nextBolt=ts+1600+Math.random()*2800}fgCtx.clearRect(0,0,W,H);fgCtx.globalCompositeOperation='lighter';for(const e of embers){e.y+=e.vy;const x=e.baseX+Math.sin(fgT*e.swaySpeed*2+e.swayPhase)*e.swayAmp;if(e.y>H+60){e.y=-20;e.baseX=Math.random()*W}const ds=e.size*12;fgCtx.globalAlpha=e.alpha;fgCtx.drawImage(emberSprites[e.sprite],x-ds/2,e.y-ds/2,ds,ds)}fgCtx.globalAlpha=1;fgCtx.globalCompositeOperation='source-over'}
  function sync(){if(document.documentElement.getAttribute('data-theme')==='horror'){if(running)return;running=true;if(!emberSprites)emberSprites=[buildSprite([255,250,240],[255,140,60],[255,40,20]),buildSprite([255,245,245],[255,60,40],[180,0,0])];resize();rafId=requestAnimationFrame(frame)}else{running=false;if(rafId)cancelAnimationFrame(rafId);bgCtx.clearRect(0,0,W,H);fgCtx.clearRect(0,0,W,H)}}
  new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  window.addEventListener('resize',()=>{if(running)resize()});
  sync();
})();

loadProfile();
</script>
</body>
</html>
